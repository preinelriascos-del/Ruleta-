<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ruleta SENA - Trabajo Digno</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 25px 12px;
    min-height: 100vh;
    font-family: Arial, sans-serif;
    text-align: center;
    color: white;
    background:
        radial-gradient(circle at 15% 15%, #49327e 0%, transparent 35%),
        radial-gradient(circle at 85% 80%, #7139a5 0%, transparent 35%),
        linear-gradient(135deg, #080d27, #17194b, #35145c);
    overflow-x: hidden;
}

.decoracion {
    position: fixed;
    z-index: -1;
    opacity: 0.13;
    pointer-events: none;
    user-select: none;
}

.balanza {
    top: 8%;
    left: 3%;
    font-size: 125px;
}

.libros {
    bottom: 8%;
    right: 3%;
    font-size: 115px;
}

.martillo {
    top: 45%;
    right: 2%;
    font-size: 90px;
}

h1 {
    font-size: 30px;
    color: #ffdf75;
    text-shadow: 2px 3px 8px #000;
}

.subtitulo {
    color: #f5e6ff;
    font-weight: bold;
    line-height: 1.5;
}

.contenedor {
    max-width: 650px;
    margin: 25px auto;
    padding: 25px 15px;
    background: white;
    color: #35145c;
    border: 3px solid #d9b65d;
    border-radius: 25px;
    box-shadow: 0 12px 35px #0008;
}

.contenedor h2 {
    color: #35145c;
}

.contador {
    background: #f1e4ff;
    padding: 14px;
    border-radius: 15px;
    font-weight: bold;
    font-size: 18px;
    border: 2px solid #d9b65d;
}

.ruleta-contenedor {
    position: relative;
    width: min(88vw, 390px);
    aspect-ratio: 1;
    margin: 30px auto;
}

canvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 8px 22px #0005;
}

.flecha {
    position: absolute;
    top: -19px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 2;
    color: #ffca28;
    font-size: 45px;
    text-shadow: 0 3px 5px #333;
}

button {
    border: none;
    border-radius: 30px;
    padding: 15px 20px;
    margin: 7px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: .2s;
}

button:hover {
    transform: scale(1.04);
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.girar {
    background: linear-gradient(135deg, #ffdb45, #ff9f1c);
    color: #35145c;
    font-size: 18px;
}

.eliminar {
    background: #e53955;
    color: white;
}

.reiniciar {
    background: #7139a5;
    color: white;
}

.sonido {
    background: #263b83;
    color: white;
}

.reto-btn {
    background: #00897b;
    color: white;
}

.resultado {
    margin-top: 25px;
    padding: 22px;
    border-radius: 20px;
    background: linear-gradient(135deg, #f4e9ff, #e4d2ff);
    border: 2px solid #d9b65d;
}

.numero {
    width: 75px;
    height: 75px;
    margin: auto;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #7139a5, #a044d5);
    color: white;
    font-size: 35px;
    font-weight: bold;
}

#pregunta {
    font-size: 19px;
    font-weight: bold;
    line-height: 1.5;
}

#mensaje {
    color: #7139a5;
    font-size: 14px;
}

.penitencia {
    display: none;
    margin-top: 18px;
    padding: 18px;
    border-radius: 17px;
    background: #fff3cd;
    border: 2px dashed #e0a800;
    color: #593b00;
}

.penitencia h3 {
    margin-top: 0;
    color: #8a5800;
}

#textoReto {
    font-size: 17px;
    font-weight: bold;
    line-height: 1.5;
}

.pie {
    color: #eee;
    font-size: 13px;
    margin-top: 20px;
}

@media (max-width: 450px) {
    h1 {
        font-size: 24px;
    }

    .contenedor {
        padding: 20px 10px;
    }

    .balanza {
        font-size: 80px;
    }

    .libros {
        font-size: 75px;
    }

    #pregunta {
        font-size: 17px;
    }
}
</style>
</head>

<body>

<div class="decoracion balanza">⚖️</div>
<div class="decoracion libros">📚</div>
<div class="decoracion martillo">🔨</div>

<h1>⚖️ RULETA DEL CONOCIMIENTO</h1>

<p class="subtitulo">
    DERECHO LABORAL Y JUSTICIA
    <br>
    Trabajo digno y trabajo decente
</p>

<div class="contenedor">

    <h2>¡GIRA Y RESPONDE!</h2>

    <div class="contador">
        Preguntas disponibles:
        <span id="cantidad">6</span> / 6
    </div>

    <div class="ruleta-contenedor">
        <div class="flecha">▼</div>
        <canvas id="ruleta" width="600" height="600"></canvas>
    </div>

    <button class="girar" id="botonGirar" onclick="girarRuleta()">
        🎯 GIRAR RULETA
    </button>

    <button class="sonido" id="botonSonido" onclick="alternarSonido()">
        🔊 Sonido activado
    </button>

    <div class="resultado">

        <h2>📢 RESULTADO</h2>

        <div class="numero" id="numero">?</div>

        <p id="pregunta">
            Presiona GIRAR RULETA para comenzar.
        </p>

        <p id="mensaje">¡Mucha suerte!</p>

        <button class="reto-btn" id="botonReto"
            onclick="sacarReto()" disabled>
            🎭 NO RESPONDIÓ
        </button>

        <button class="eliminar" id="botonEliminar"
            onclick="eliminarPregunta()" disabled>
            🗑️ ELIMINAR NÚMERO
        </button>

        <div class="penitencia" id="penitencia">
            <h3>🎲 ¡RETO O PENITENCIA!</h3>
            <p id="textoReto"></p>
            <button class="reto-btn" onclick="sacarReto()">
                🔄 OTRO RETO
            </button>
        </div>

    </div>

    <button class="reiniciar" onclick="reiniciarRuleta()">
        🔄 REINICIAR TODO
    </button>

</div>

<p class="pie">
    ⚖️ Actividad educativa SENA | Derechos laborales
</p>

<script>

// 1. BANCO DE 6 PREGUNTAS

const preguntasOriginales = [
    {
        numero: 1,
        texto: "¿Por qué hablar de trabajo digno más allá de la noción de trabajo decente?"
    },
    {
        numero: 2,
        texto: "¿Cómo influye la falta de trabajo en la pobreza, la violencia y la falta de desarrollo?"
    },
    {
        numero: 3,
        texto: "Casos de personas que trabajan en condiciones inadecuadas."
    },
    {
        numero: 4,
        texto: "¿Cuáles son los principios del trabajo?"
    },
    {
        numero: 5,
        texto: "¿Cuáles son los principios del trabajo decente?"
    },
    {
        numero: 6,
        texto: "¿Cómo definiría el trabajo digno?"
    }
];

// 2. RETOS Y PENITENCIAS

const retos = [
    "🎤 Canta durante 10 segundos una canción que conozcas.",
    "🤖 Habla como un robot durante 15 segundos.",
    "💃 Baila durante 10 segundos una canción imaginaria.",
    "🗣️ Di tres palabras relacionadas con los derechos laborales.",
    "🎭 Imita a una persona que está llegando tarde al trabajo.",
    "📢 Inventa una frase corta sobre el respeto a los trabajadores.",
    "😂 Cuenta un chiste para hacer reír al grupo.",
    "🧠 Menciona tres profesiones en menos de 5 segundos.",
    "🎬 Representa sin hablar un oficio para que el grupo lo adivine.",
    "👏 Di un trabalenguas sin equivocarte."
];

// 3. COLORES

const colores = [
    "#F44336",
    "#FF9800",
    "#FFC107",
    "#8BC34A",
    "#009688",
    "#03A9F4"
];

// 4. VARIABLES

let preguntas = [...preguntasOriginales];
let angulo = 0;
let girando = false;
let seleccionada = null;
let sonidoActivado = true;
let audioContext = null;
let ultimoSector = -1;

const canvas = document.getElementById("ruleta");
const ctx = canvas.getContext("2d");

const centro = 300;
const radio = 285;

// 5. SISTEMA DE SONIDO

function audio() {
    if (!audioContext) {
        audioContext = new (
            window.AudioContext ||
            window.webkitAudioContext
        )();
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }

    return audioContext;
}

function tono(frecuencia, duracion = 0.055,
              tipo = "sine", volumen = 0.045) {

    if (!sonidoActivado) return;

    const ac = audio();
    const osc = ac.createOscillator();
    const gain = ac.createGain();

    osc.type = tipo;
    osc.frequency.setValueAtTime(frecuencia, ac.currentTime);

    gain.gain.setValueAtTime(volumen, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(
        0.001,
        ac.currentTime + duracion
    );

    osc.connect(gain);
    gain.connect(ac.destination);

    osc.start();
    osc.stop(ac.currentTime + duracion);
}

function alternarSonido() {
    sonidoActivado = !sonidoActivado;

    document.getElementById("botonSonido").textContent =
        sonidoActivado
        ? "🔊 Sonido activado"
        : "🔇 Sonido desactivado";

    if (sonidoActivado) {
        tono(660, 0.12);
    }
}

// 6. DIBUJAR RULETA

function dibujarRuleta() {

    ctx.clearRect(0, 0, 600, 600);

    if (preguntas.length === 0) {
        ctx.beginPath();
        ctx.arc(centro, centro, radio, 0, Math.PI * 2);
        ctx.fillStyle = "#7139a5";
        ctx.fill();

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "bold 28px Arial";
        ctx.fillText("¡TERMINADO!", centro, centro);

        actualizarContador();
        return;
    }

    const porcion = 2 * Math.PI / preguntas.length;

    preguntas.forEach((item, i) => {

        const inicio = angulo + i * porcion;
        const fin = inicio + porcion;

        ctx.beginPath();
        ctx.moveTo(centro, centro);
        ctx.arc(centro, centro, radio, inicio, fin);
        ctx.closePath();

        ctx.fillStyle = colores[(item.numero - 1) % colores.length];
        ctx.fill();

        ctx.strokeStyle = "white";
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.save();
        ctx.translate(centro, centro);
        ctx.rotate(inicio + porcion / 2);

        ctx.fillStyle = "white";
        ctx.font = "bold 32px Arial";
        ctx.textAlign = "right";
        ctx.textBaseline = "middle";

        ctx.fillText(item.numero, radio - 22, 0);
        ctx.restore();
    });

    ctx.beginPath();
    ctx.arc(centro, centro, 48, 0, Math.PI * 2);
    ctx.fillStyle = "#35145c";
    ctx.fill();

    ctx.strokeStyle = "#d9b65d";
    ctx.lineWidth = 5;
    ctx.stroke();

    ctx.fillStyle = "white";
    ctx.font = "bold 19px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText("SENA", centro, centro);

    actualizarContador();
}

// 7. ACTUALIZAR CONTADOR

function actualizarContador() {
    document.getElementById("cantidad").textContent =
        preguntas.length;
}

// 8. GIRAR RULETA

function girarRuleta() {

    if (girando || preguntas.length === 0) return;

    audio();

    girando = true;
    seleccionada = null;
    ultimoSector = -1;

    document.getElementById("botonGirar").disabled = true;
    document.getElementById("botonEliminar").disabled = true;
    document.getElementById("botonReto").disabled = true;

    document.getElementById("penitencia").style.display = "none";
    document.getElementById("numero").textContent = "?";
    document.getElementById("pregunta").textContent =
        "¡La ruleta está girando!";
    document.getElementById("mensaje").textContent =
        "Esperando el resultado...";

    const vueltas = 8 + Math.random() * 5;
    const extra = Math.random() * Math.PI * 2;

    const inicio = angulo;
    const destino = inicio + vueltas * 2 * Math.PI + extra;

    const duracion = 5000;
    const tiempoInicio = performance.now();

    function animar(tiempo) {

        const progreso = Math.min(
            (tiempo - tiempoInicio) / duracion, 1
        );

        const suavizado = 1 - Math.pow(1 - progreso, 4);

        angulo = inicio + (destino - inicio) * suavizado;

        const porcion = (2 * Math.PI) / preguntas.length;

        const posicion =
            (-Math.PI / 2 - angulo) % (2 * Math.PI);

        const normalizada =
            (posicion + 2 * Math.PI) % (2 * Math.PI);

        const sector = Math.floor(normalizada / porcion);

        if (sector !== ultimoSector) {
            tono(500, 0.035, "square", 0.025);
            ultimoSector = sector;
        }

        dibujarRuleta();

        if (progreso < 1) {
            requestAnimationFrame(animar);
        } else {
            angulo = destino;
            terminarGiro();
        }
    }

    requestAnimationFrame(animar);
}

// 9. MOSTRAR RESULTADO

function terminarGiro() {

    const porcion = (2 * Math.PI) / preguntas.length;

    const posicion =
        (-Math.PI / 2 - angulo) % (2 * Math.PI);

    const normalizada =
        (posicion + 2 * Math.PI) % (2 * Math.PI);

    const indice = Math.floor(normalizada / porcion);

    seleccionada = preguntas[indice];

    document.getElementById("numero").textContent =
        seleccionada.numero;

    document.getElementById("pregunta").textContent =
        seleccionada.texto;

    document.getElementById("mensaje").textContent =
        "¡Es momento de responder!";

    tono(660, 0.18);
    setTimeout(() => tono(880, 0.22), 130);
    setTimeout(() => tono(1100, 0.3), 280);

    document.getElementById("botonEliminar").disabled = false;
    document.getElementById("botonReto").disabled = false;
    document.getElementById("botonGirar").disabled = false;

    girando = false;
}

// 10. SACAR RETO SI NO RESPONDE

function sacarReto() {

    if (!seleccionada || girando) return;

    const indice = Math.floor(Math.random() * retos.length);

    document.getElementById("textoReto").textContent =
        retos[indice];

    document.getElementById("penitencia").style.display = "block";

    document.getElementById("mensaje").textContent =
        "¡Debe cumplir el reto para continuar!";

    tono(520, 0.15);
}

// 11. ELIMINAR PREGUNTA

function eliminarPregunta() {

    if (!seleccionada || girando) return;

    const numeroEliminado = seleccionada.numero;

    preguntas = preguntas.filter(
        item => item.numero !== numeroEliminado
    );

    seleccionada = null;
    angulo = 0;

    document.getElementById("numero").textContent =
        numeroEliminado + " ✓";

    document.getElementById("pregunta").textContent =
        "¡El número " + numeroEliminado + " fue eliminado!";

    document.getElementById("mensaje").textContent =
        "Esta pregunta no volverá a salir.";

    document.getElementById("botonEliminar").disabled = true;
    document.getElementById("botonReto").disabled = true;
    document.getElementById("penitencia").style.display = "none";

    if (preguntas.length === 0) {

        document.getElementById("pregunta").textContent =
            "¡Todas las preguntas fueron seleccionadas!";

        document.getElementById("mensaje").textContent =
            "Puedes reiniciar para volver a jugar.";

        document.getElementById("botonGirar").disabled = true;
    }

    dibujarRuleta();
}

// 12. REINICIAR RULETA

function reiniciarRuleta() {

    if (girando) return;

    if (!confirm("¿Deseas recuperar todas las preguntas del 1 al 6?")) {
        return;
    }

    preguntas = [...preguntasOriginales];
    angulo = 0;
    seleccionada = null;

    document.getElementById("numero").textContent = "?";

    document.getElementById("pregunta").textContent =
        "Presiona GIRAR RULETA para comenzar.";

    document.getElementById("mensaje").textContent =
        "¡Mucha suerte!";

    document.getElementById("penitencia").style.display = "none";
    document.getElementById("botonGirar").disabled = false;
    document.getElementById("botonEliminar").disabled = true;
    document.getElementById("botonReto").disabled = true;

    dibujarRuleta();
}

// 13. INICIAR RULETA

dibujarRuleta();

</script>
</body>
</html>
